[package]
name = "compu"
version = "2.0.0"
authors = ["Douman <douman@gmx.se>"]
edition = "2018"
keywords = ["brotli", "zstd", "zlib"]
categories = ["compression", "api-bindings"]
description = "Rust Compression library with generic interface"
license = "BSL-1.0"
repository = "https://github.com/DoumanAsh/compu"
documentation = "https://docs.rs/crate/compu"
include = [
    "**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies.compu-brotli-sys]
version = "1.2.0"
optional = true
default-features = false

[dependencies.libz-sys]
version = "1.1.29"
optional = true
default-features = false

[dependencies.libz-ng-sys]
version = "1.1.29"
optional = true
default-features = false

[dependencies.zlib-rs]
version = "0.6"
optional = true
default-features = false
# https://github.com/trifectatechfoundation/zlib-rs/blob/ac6904a9f5d1a391a0401a94cc20be2f03e317e9/zlib-rs/src/lib.rs#L14
features = ["rust-allocator", "__internal-api"]

[dependencies.zstd-sys]
version = "2.1"
optional = true
default-features = false
# For advanced stream features (mostly for purpose of custom malloc)
features = ["experimental"]

[dependencies.brotli]
version = "9"
optional = true
default-features = false

[dependencies.bytes]
version = "1"
optional = true
default-features = false

[features]
default = []
brotli-rust = ["brotli"]
brotli-c = ["compu-brotli-sys"]
#Regular zlib bindings
zlib = ["libz-sys"]
zlib-static = ["libz-sys/static"]
#zlib-ng bindings (requires cmake)
zlib-ng = ["libz-ng-sys"]
#zlib-rs
zlib-rust = ["zlib-rs"]
#enables ZSTD
zstd = ["zstd-sys"]

[package.metadata.docs.rs]
features = ["zstd", "brotli-c", "brotli-rust", "zlib", "zlib-ng", "zlib-rust", "bytes"]
